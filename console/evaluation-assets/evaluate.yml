# platform-gate: v1 — configurable business evaluation, no fabricated passes
name: eval-gate
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r evaluation/requirements.txt
      - name: Run configured business evaluation
        run: python -m pytest evaluation/test_evaluation.py -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-gate-report
          path: evaluation/report.json
