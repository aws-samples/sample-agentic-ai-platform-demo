name: Verify Stage 1 Serverless Platform

'on':
  push:
    branches:
      - main
      - feat/serverless-aws-deployment
    paths:
      - console/**
      - e2e/**
      - infra/platform-registry/**
      - infra/serverless-platform/**
      - .github/workflows/deploy-serverless-platform.yml
      - .github/workflows/verify-serverless-platform.yml
      - package.json
      - package-lock.json
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-agentic-platform-web-${{ vars.AWS_ACCOUNT_ID }}-${{ vars.AWS_REGION }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify serverless platform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json
            infra/platform-registry/package-lock.json
            infra/serverless-platform/package-lock.json

      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm --prefix e2e ci
          npm --prefix infra/platform-registry ci
          npm --prefix infra/serverless-platform ci

      - name: Install Chromium headless shell
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix e2e exec -- playwright install --with-deps --only-shell chromium

      - name: Set up Python for exported evaluation tests
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install exported evaluation test dependency
        shell: bash
        run: python -m pip install "pytest>=8,<9"

      - name: Run tests and TypeScript build
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm --prefix infra/platform-registry test
          npm --prefix infra/platform-registry run build
          npm --prefix infra/serverless-platform test
          npm --prefix infra/serverless-platform run build

      - name: Audit high and critical dependency findings
        shell: bash
        run: |
          set -euo pipefail
          npm audit --audit-level=high
          npm --prefix e2e audit --audit-level=high
          npm --prefix infra/platform-registry audit --audit-level=high
          npm --prefix infra/serverless-platform audit --audit-level=high

      - name: Synthesize control plane
        working-directory: infra/platform-registry
        shell: bash
        run: |
          set -euo pipefail
          SYNTH_ACCOUNT_ID="$(printf '1%.0s' {1..12})"
          npm exec -- cdk synth AgenticPlatform-ControlPlane-Provisioned \
            --quiet \
            --context "mode=provision" \
            --context "account=$SYNTH_ACCOUNT_ID" \
            --context "region=us-west-2"

      - name: Synthesize web with CDK Nag
        working-directory: infra/serverless-platform
        shell: bash
        run: |
          set -euo pipefail
          SYNTH_ACCOUNT_ID="$(printf '1%.0s' {1..12})"
          npm exec -- cdk synth PlatformWebStack \
            --quiet \
            --context "account=$SYNTH_ACCOUNT_ID" \
            --context "region=us-west-2" \
            --context "cognitoDomainPrefix=agentic-platform-ci" \
            --context "llmGatewayId=agentic-platform-ci-abcdefghij" \
            --context "llmGatewayRegion=us-west-2"

      - name: Run targeted browser authentication fixture
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          node --test e2e/smoke-auth-integration.mjs

  deploy:
    name: Deploy serverless platform
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref_protected == true && vars.ENABLE_GITHUB_DEPLOYMENT == 'true' && vars.BRANCH_PROTECTION_ATTESTED == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-serverless-platform.yml
